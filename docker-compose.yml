services:
  postgres:
    image: postgres:15-alpine
    container_name: sales-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sales_db}
      POSTGRES_USER: ${DB_USER:-sales_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sales_pass}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sales-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sales_user} -d ${DB_NAME:-sales_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sales-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - sales-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Flyway migrations and, on the dev profile, the demo seed both run inside
  # this container's startup. There is no third command.
  api:
    build:
      context: ./apps/api
    container_name: sales-api
    restart: on-failure
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_PROFILE: ${SPRING_PROFILE:-dev}
      DB_HOST: postgres
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - sales-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/v3/api-docs || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: ./apps/web
    container_name: sales-web
    restart: on-failure
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      # Server-side only: the browser talks to this app, this app talks to the
      # API. That is why the value is a container name and not localhost.
      API_BASE_URL: http://api:8080/api
    networks:
      - sales-net
    depends_on:
      api:
        condition: service_started

networks:
  sales-net:
    driver: bridge

volumes:
  postgres_data:
